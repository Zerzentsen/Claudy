[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "claudy"
version = "0.1.0"
description = "A skill-based CLI assistant"
requires-python = ">=3.9"

[project.scripts]
claudy = "claudy.cli:main"

[tool.setuptools.packages.find]
include = ["claudy*"]
